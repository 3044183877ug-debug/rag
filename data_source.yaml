# 研发费用加计扣除政策“家族树”（主从继承与历史版本）
# ────────────────────────────────────────────────────────────────

# 👨‍💻 【底层基石法 1：管辖全盘核心范围】
  - file_name: "财税2015_119号_研发加计扣除母法.txt"
    policy_name: "关于完善研究开发费用税前加计扣除政策的通知"
    source: "财税〔2015〕119号"
    doc_type: "核心基准文件"
    status: "现行有效"
    date_published: "2015-11-02"
    date_effective: "2016-01-01"
    url: "https://www.chinatax.gov.cn/chinatax/n810341/n810765/n1990035/201601/c2184730/content.html"
    applicable_scope: "界定研发活动的定义、人员人工、直接投入等6大类费用的归集口径，以及负面清单行业。"

# 👨‍💻 【底层基石法 2：管辖境外研发特例】
  - file_name: "财税2018_64号_委托境外研发.txt"
    policy_name: "关于企业委托境外研究开发费用税前加计扣除有关政策问题的通知"
    source: "财税〔2018〕64号"
    doc_type: "核心基准文件"
    status: "现行有效"
    date_published: "2018-06-25"
    date_effective: "2018-01-01"
    url: "https://www.gov.cn/zhengce/zhengceku/2018-12/31/content_5442063.htm"
    applicable_scope: "明确委托境外进行研发活动所发生费用的加计扣除规则（按实际发生额的80%计入，且不超过境内符合条件研发费用的三分之二）。"

# 🌟 【现行有效补丁：管辖当前最新比例】
  - file_name: "财税2023_7号_研发加计扣除现行比例.txt"
    policy_name: "关于进一步完善研发费用税前加计扣除政策的公告"
    source: "财政部 税务总局 科技部公告2023年第7号"
    doc_type: "最新比例更新公告"
    status: "现行有效"
    date_published: "2023-03-26"
    date_effective: "2023-01-01"
    url: "https://www.gov.cn/zhengce/zhengceku/2023-03/28/content_5748747.htm"
    applicable_scope: "作为最新参数补丁，规定自2023年1月1日起，所有符合条件企业的加计扣除比例统一提升为100%。"

# 个税专项附加扣除最新标准
